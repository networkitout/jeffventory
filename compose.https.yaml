services:
  app:
    ports: !reset []

  https:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      JEFFVENTORY_HOSTNAME: ${JEFFVENTORY_HOSTNAME:-localhost}
    ports:
      - target: 443
        published: "${JEFFVENTORY_HTTPS_PORT:-8443}"
        host_ip: ${JEFFVENTORY_BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  certificates:
  caddy-config:
