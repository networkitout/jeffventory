name: jeffventory

services:
  app:
    image: ${JEFFVENTORY_IMAGE:-jeffventory:local}
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: file:/data/inventory.db
      UPLOAD_DIR: /data/uploads
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random BETTER_AUTH_SECRET in .env.docker}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    ports:
      - target: 3000
        published: "${JEFFVENTORY_PORT:-3000}"
        host_ip: ${JEFFVENTORY_BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
    volumes:
      - inventory:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  inventory:
